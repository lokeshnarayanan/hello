apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    path: .
    repoURL: https://github.com/lokeshnarayanan/hello.git
    targetRevision: main
  sources: []
  project: hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
